name: Build and publish playtest

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the playtest to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: mutant-playtest
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        with:
          path: dist/

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playtest
        id: deployment
        uses: actions/deploy-pages@v4
